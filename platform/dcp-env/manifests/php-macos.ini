; DCP-managed PHP CLI configuration. Applied only to the private DCP runtime.
date.timezone=UTC
memory_limit=512M
max_execution_time=0
max_input_time=0
file_uploads=On
upload_max_filesize=1G
post_max_size=1G
display_errors=Off
log_errors=On
curl.cainfo=/etc/ssl/cert.pem
openssl.cafile=/etc/ssl/cert.pem
