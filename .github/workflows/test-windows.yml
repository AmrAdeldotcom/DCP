name: Test DCP Windows build

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/**'
  push:
    branches: ['**']
    paths:
      - 'platform/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows application
        shell: pwsh
        run: ./platform/scripts/build-windows.ps1 -DCPVersion 'v1.0.0-alpha.6'
      - name: Parse PowerShell installer and updater scripts
        shell: pwsh
        run: |
          $files = @(
            'platform/scripts/build-windows.ps1',
            'platform/scripts/install-runtime-windows.ps1',
            'platform/scripts/update-windows.ps1',
            'platform/Install-DCP-Online.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell syntax errors in {0}: {1}" -f $file, ($errors | Out-String)) }
            Write-Host "PASS PowerShell syntax: $file"
          }
      - name: Verify Windows package and exclude developer data
        shell: pwsh
        run: |
          if (!(Test-Path 'platform/dist/windows/DCP.exe')) { throw 'DCP.exe missing' }
          if (!(Test-Path 'platform/dist/windows/runtime/php/php.exe')) { throw 'Private PHP runtime missing' }
          if (!(Test-Path 'platform/dist/windows/platform/scripts/update-windows.ps1')) { throw 'Self-updater missing' }
          if (Test-Path 'platform/dist/windows/platform/storage/keys/master.key') { throw 'Developer encryption key leaked into package' }
          if (Test-Path 'platform/dist/windows/platform/data/dcp.sqlite') { throw 'Developer SQLite database leaked into package' }
