name: Test DCP Cloud PHP

on:
  pull_request:
    paths:
      - 'platform/cloud/**'
      - 'platform/app/Services/CloudService.php'
      - 'platform/app/Controllers/ApiController.php'
      - 'platform/tests/run.php'
      - '.github/workflows/test-cloud.yml'
      - 'README.md'
  push:
    branches: ['**']
    paths:
      - 'platform/cloud/**'
      - 'platform/app/Services/CloudService.php'
      - 'platform/app/Controllers/ApiController.php'
      - 'platform/tests/run.php'
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Validate Cloud PHP source
        run: |
          php -l platform/cloud/index.php
          test ! -e platform/cloud/site.php
          php -l platform/app/Services/CloudService.php
          php -l platform/app/Controllers/ApiController.php
          php -l platform/tests/run.php
          grep -q '^DB_HOST=localhost$' platform/cloud/.env.example
          test ! -e platform/cloud/.env
          grep -q 'pairing_codes' platform/cloud/schema.migrate.sql
          grep -q 'device_pairings' platform/cloud/schema.migrate.sql
          grep -q 'api_rate_limits' platform/cloud/schema.migrate.sql
          grep -q 'rate_limit(' platform/cloud/index.php
          grep -q "rate_limit('anonymous-device-register'" platform/cloud/index.php
          grep -q 'devices/anonymous/register' platform/cloud/index.php
          grep -q 'pairing-requests' platform/cloud/index.php
