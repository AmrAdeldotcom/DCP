name: Clean legacy DCP releases and failed CI history

on:
  workflow_run:
    workflows: ['Build and publish DCP signed cross-platform release']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-github.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup-after-stable-release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'v1.0.0')
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify stable release, then remove legacy releases, tags and failed runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const stableTag = 'v1.0.0';
            const stable = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: stableTag })).data;
            if (stable.draft || stable.prerelease || !stable.published_at) {
              throw new Error('Refusing cleanup: v1.0.0 is not a published stable release.');
            }

            const required = [
              'DCP-Windows-x64.zip',
              'DCP-Linux-x64.tar.gz',
              'DCP-macOS-Intel.zip',
              'DCP-macOS-AppleSilicon.zip',
              'DCP-Windows-x64.zip.sha256',
              'DCP-Linux-x64.tar.gz.sha256',
              'DCP-macOS-Intel.zip.sha256',
              'DCP-macOS-AppleSilicon.zip.sha256',
              'DCP-Windows-update-v3.json',
              'DCP-Windows-update-v3.json.sig',
              'DCP-Linux-update-v3.json',
              'DCP-Linux-update-v3.json.sig',
              'DCP-macOS-Intel-update-v3.json',
              'DCP-macOS-Intel-update-v3.json.sig',
              'DCP-macOS-AppleSilicon-update-v3.json',
              'DCP-macOS-AppleSilicon-update-v3.json.sig'
            ];
            const present = new Set((stable.assets || []).map(asset => asset.name));
            const missing = required.filter(name => !present.has(name));
            if (missing.length) {
              throw new Error(`Refusing cleanup: stable release is missing required assets: ${missing.join(', ')}`);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let deletedReleases = 0;
            for (const release of releases) {
              if (release.id === stable.id || !/^v\d+\.\d+\.\d+-(alpha|beta)\./.test(release.tag_name)) continue;
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              deletedReleases++;
            }

            const refs = await github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: 'tags/v' });
            const legacyRefs = refs.filter(ref => /^refs\/tags\/v\d+\.\d+\.\d+-(alpha|beta)\./.test(ref.ref));
            let deletedTags = 0;
            for (const ref of legacyRefs) {
              await github.rest.git.deleteRef({ owner, repo, ref: ref.ref.replace(/^refs\//, '') });
              deletedTags++;
            }

            // List workflow runs explicitly. The Actions endpoint returns an object
            // containing workflow_runs, not an array, so the default paginate mapper
            // is not appropriate here.
            const runs = [];
            for (let page = 1; page <= 100; page++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 100, page });
              const batch = Array.isArray(response.data.workflow_runs) ? response.data.workflow_runs.filter(Boolean) : [];
              runs.push(...batch);
              if (batch.length < 100) break;
            }

            const stablePublishedAt = Date.parse(stable.published_at);
            const cleanupWorkflowName = 'Clean legacy DCP releases and failed CI history';
            const failures = runs.filter(run => {
              if (!run || run.id === context.runId || run.status !== 'completed' || run.conclusion !== 'failure') return false;
              const createdAt = Date.parse(run.created_at || '');
              // Remove pre-stable failures and previous failures of this cleanup job.
              // Never erase unrelated failures produced after the stable release.
              return createdAt < stablePublishedAt || run.name === cleanupWorkflowName;
            });
            let deletedRuns = 0;
            for (const run of failures) {
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              deletedRuns++;
            }

            const remainingPreStableFailures = runs.filter(run =>
              run && run.id !== context.runId && run.status === 'completed' && run.conclusion === 'failure' &&
              Date.parse(run.created_at || '') < stablePublishedAt && !failures.some(item => item.id === run.id)
            ).length;

            core.summary
              .addHeading('DCP stable release cleanup completed')
              .addTable([
                [{ data: 'Item', header: true }, { data: 'Removed / retained', header: true }],
                ['Legacy Alpha/Beta releases', String(deletedReleases)],
                ['Legacy Alpha/Beta tags', String(deletedTags)],
                ['Completed failed Actions runs', String(deletedRuns)],
                ['Remaining pre-stable failed runs in fetched pages', String(remainingPreStableFailures)],
                ['Preserved stable release', stableTag]
              ])
              .addLink('Stable release', stable.html_url);
            await core.summary.write();
