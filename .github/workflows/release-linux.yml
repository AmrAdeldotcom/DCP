name: Build and publish DCP Linux release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: dcp-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK/WebKit and PHP runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev php-cli php-curl php-intl php-mbstring php-sqlite3 php-xml php-gd php-zip

      - name: Verify PHP runtime
        run: php platform/scripts/verify-runtime.php

      - name: Build portable Linux application
        run: |
          chmod +x platform/scripts/*.sh
          DCP_VERSION="${GITHUB_REF_NAME#v}" platform/scripts/build-linux.sh

      - name: Verify package and linked runtime dependencies
        run: |
          set -euo pipefail
          ROOT=platform/dist/linux
          test -x "$ROOT/DCP"
          test -x "$ROOT/Run-DCP.sh"
          test -x "$ROOT/Install-DCP-Launcher.sh"
          test -f "$ROOT/DCP.desktop"
          test -f "$ROOT/platform/public/router.php"
          test -s "$ROOT/platform/update/release-public.pem"
          test -s "$ROOT/platform/update/manifest.schema.json"
          test -f "$ROOT/platform/app/Core/Database.php"
          test -f "$ROOT/platform/app/Controllers/ApiController.php"
          test -f "$ROOT/platform/dcp-env/manifests/php-runtime.json"
          test -f "$ROOT/platform/dcp-env/README.md"
          test -s "$ROOT/platform/version.json"
          PACKAGE_VERSION="$(php -r '$v=json_decode(file_get_contents($argv[1]),true); echo $v["version"] ?? "";' "$ROOT/platform/version.json")"
          test "$PACKAGE_VERSION" = "${GITHUB_REF_NAME#v}"
          PACKAGE_TAG="$(php -r '$v=json_decode(file_get_contents($argv[1]),true); echo $v["releaseTag"] ?? "";' "$ROOT/platform/version.json")"
          test "$PACKAGE_TAG" = "$GITHUB_REF_NAME"
          PACKAGE_REVISION="$(php -r '$v=json_decode(file_get_contents($argv[1]),true); echo $v["packageRevision"] ?? 0;' "$ROOT/platform/version.json")"
          test "$PACKAGE_REVISION" -ge 1
          test ! -d "$ROOT/platform/dcp-env/build"
          test -d "$ROOT/DCP-UserData/Linux/data"
          test -d "$ROOT/DCP-UserData/Linux/storage"
          test -f "$ROOT/DCP-UserData/README.txt"
          test ! -f "$ROOT/DCP-UserData/Linux/storage/keys/master.key"
          test ! -f "$ROOT/DCP-UserData/Linux/data/dcp.sqlite"
          bash -n "$ROOT/Run-DCP.sh" "$ROOT/Install-DCP-Launcher.sh" platform/Install-DCP-Online.sh
          php "$ROOT/platform/scripts/verify-runtime.php"
          if ldd "$ROOT/DCP" | grep -q 'not found'; then
            echo "Linux DCP binary has unresolved shared-library dependencies." >&2
            ldd "$ROOT/DCP"
            exit 1
          fi
          if grep -F '"$PHP_BIN" "$ROOT/platform/scripts/install-runtime-linux.sh"' "$ROOT/Run-DCP.sh"; then
            echo "Run-DCP.sh is incorrectly invoking a shell script through PHP." >&2
            exit 1
          fi

      - name: Smoke-test packaged Linux application
        run: bash platform/tests/linux-package-smoke.sh platform/dist/linux

      - name: Create Linux release archive and checksum
        run: |
          set -euo pipefail
          tar -czf DCP-Linux-x64.tar.gz -C platform/dist/linux .
          sha256sum DCP-Linux-x64.tar.gz > DCP-Linux-x64.tar.gz.sha256
          test -s DCP-Linux-x64.tar.gz
          test -s DCP-Linux-x64.tar.gz.sha256

      - name: Publish Linux package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DCP ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
          make_latest: false
          files: |
            DCP-Linux-x64.tar.gz
            DCP-Linux-x64.tar.gz.sha256
