name: Build DCP Linux WebView

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/build-linux.yml'
      - 'README.md'
      - 'INSTALL.md'

permissions:
  contents: read

jobs:
  build-ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install GTK/WebKit and PHP runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev php-cli php-curl php-intl php-mbstring php-sqlite3 php-xml php-gd php-zip
      - name: Verify PHP runtime
        run: php platform/scripts/verify-runtime.php
      - name: Build Linux WebView
        run: platform/scripts/build-linux.sh
      - name: Verify package contents
        run: |
          test -x platform/dist/linux/DCP
          test -x platform/dist/linux/Run-DCP.sh
          test -f platform/dist/linux/platform/public/router.php
          test -d platform/dist/linux/platform/data
          test -d platform/dist/linux/platform/storage
      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCP-Linux-x64
          path: platform/dist/linux/
          if-no-files-found: error
