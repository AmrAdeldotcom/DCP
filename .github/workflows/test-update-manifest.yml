name: Test signed update manifest and delta package tooling

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcp-update-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate PHP manifest verifier
        run: |
          set -euo pipefail
          php -l platform/scripts/lib/UpdateManifest.php
          php -l platform/tests/update-manifest.php
          php platform/tests/update-manifest.php
          php -l platform/tests/github-release-feed.php
          php platform/tests/github-release-feed.php

      - name: Validate delta and manifest builders
        run: |
          set -euo pipefail
          python -m py_compile platform/scripts/build-update-manifest.py platform/scripts/build-delta-package.py platform/scripts/compare-semver.py platform/tests/update-package-build.py
          python platform/tests/update-package-build.py

      - name: Verify detached signing and tamper rejection
        run: bash platform/tests/sign-update-manifest.sh

      - name: Verify four-platform signed release assembly and full fallback
        run: bash platform/tests/release-assembly.sh

      - name: Regress real Alpha 9 Linux package repair Delta
        run: bash platform/tests/alpha9-linux-delta-regression.sh

      - name: Verify atomic cross-platform release workflow wiring
        run: ruby platform/tests/release-workflow-contract.rb

      - name: Verify production signing secret matches the pinned public key
        if: github.event_name != 'pull_request'
        env:
          DCP_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DCP_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${DCP_RELEASE_SIGNING_PRIVATE_KEY_B64:-}" ]]; then
            echo "::warning::Production release signing is not configured. Contract tests remain valid; the release assembly workflow will block until DCP_RELEASE_SIGNING_PRIVATE_KEY_B64 is added."
            exit 0
          fi
          printf '%s\n' '{"schema":3,"purpose":"production-key-preflight"}' > "$RUNNER_TEMP/dcp-production-key-preflight.json"
          bash platform/scripts/sign-update-manifest.sh \
            "$RUNNER_TEMP/dcp-production-key-preflight.json" \
            "$RUNNER_TEMP/dcp-production-key-preflight.json.sig"
          rm -f "$RUNNER_TEMP/dcp-production-key-preflight.json" "$RUNNER_TEMP/dcp-production-key-preflight.json.sig"
