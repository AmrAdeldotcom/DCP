name: Test DCP Linux distro compatibility

on:
  push:
    branches: ['**']
    paths:
      - 'platform/**'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/test-linux-distros.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/test-linux-distros.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-package:
    name: Build portable Linux package (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev php-cli php-curl php-intl php-mbstring php-sqlite3 php-xml php-gd php-zip
      - name: Build Linux package
        run: |
          chmod +x platform/scripts/*.sh
          platform/scripts/build-linux.sh
      - name: Archive Linux package with executable permissions
        run: tar -czf DCP-Linux-distro-test.tar.gz -C platform/dist/linux .
      - name: Upload Linux package archive
        uses: actions/upload-artifact@v4
        with:
          name: dcp-linux-distro-test-package
          path: DCP-Linux-distro-test.tar.gz
          if-no-files-found: error
          retention-days: 3

  kali-rolling-smoke:
    name: Install dependencies and smoke-test on Kali Rolling
    needs: build-linux-package
    runs-on: ubuntu-24.04
    container:
      image: kalilinux/kali-rolling:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Kali runtime dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash ca-certificates coreutils curl file libgtk-3-0 libwebkit2gtk-4.1-0 php-cli php-curl php-intl php-mbstring php-sqlite3 php-xml php-gd php-zip procps tar
      - name: Download portable Linux package archive
        uses: actions/download-artifact@v4
        with:
          name: dcp-linux-distro-test-package
          path: ${{ runner.temp }}/dcp-linux-artifact
      - name: Extract Linux package preserving executable permissions
        shell: bash
        run: |
          mkdir -p platform/dist/linux
          tar -xzf "${{ runner.temp }}/dcp-linux-artifact/DCP-Linux-distro-test.tar.gz" -C platform/dist/linux
      - name: Verify Kali libraries and package contents
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=platform/dist/linux
          test -x "$ROOT/DCP"
          test -x "$ROOT/Run-DCP.sh"
          test -f "$ROOT/platform/app/Core/Database.php"
          test -f "$ROOT/platform/public/router.php"
          if ldd "$ROOT/DCP" | grep -q 'not found'; then ldd "$ROOT/DCP"; exit 1; fi
          php "$ROOT/platform/scripts/verify-runtime.php"
      - name: Smoke-test packaged DCP HTTP API on Kali
        shell: bash
        run: bash platform/tests/linux-package-smoke.sh platform/dist/linux
