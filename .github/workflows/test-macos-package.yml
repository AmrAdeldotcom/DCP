name: Test clean DCP native macOS packages

on:
  push:
    paths:
      - "platform/version.json"
      - "platform/config/app.php"
      - "platform/app/Controllers/PageController.php"
      - ".github/workflows/test-macos-package.yml"
      - ".github/workflows/build-llama-macos-sse42.yml"
      - ".github/workflows/build-llama-macos-arm64.yml"
      - ".github/workflows/build-php-runtime-macos.yml"
      - ".github/workflows/release-macos.yml"
      - "platform/dcp-env/**"
      - "platform/scripts/install-runtime-macos.sh"
      - "platform/scripts/build-macos.sh"
      - "platform/scripts/verify-runtime.php"
      - "platform/tests/runtime-macos-installer.sh"
      - "platform/wrappers/macos/**"
      - "platform/wrappers/build-macos.sh"
      - "platform/Install-DCP-Online.sh"
  pull_request:
    paths:
      - "platform/version.json"
      - ".github/workflows/**macos*.yml"
      - "platform/dcp-env/**"
      - "platform/scripts/install-runtime-macos.sh"
      - "platform/scripts/build-macos.sh"
      - "platform/scripts/verify-runtime.php"
      - "platform/tests/runtime-macos-installer.sh"
      - "platform/wrappers/macos/**"
      - "platform/wrappers/build-macos.sh"
      - "platform/Install-DCP-Online.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-php-runtime:
    uses: ./.github/workflows/build-php-runtime-macos.yml

  intel-llama:
    uses: ./.github/workflows/build-llama-macos-sse42.yml

  arm64-llama:
    uses: ./.github/workflows/build-llama-macos-arm64.yml

  macos-native-package:
    needs: [managed-php-runtime, intel-llama, arm64-llama]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            php_arch: macos-x64
            runtime_dir: macos-x64-sse42
            engine_artifact: dcp-llama-macos-x64-sse42
            package: DCP-macOS-Intel-ci.zip
          - arch: arm64
            runner: macos-15
            php_arch: macos-arm64
            runtime_dir: macos-arm64
            engine_artifact: dcp-llama-macos-arm64
            package: DCP-macOS-AppleSilicon-ci.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test runtime bootstrap selection and integrity
        run: bash platform/tests/runtime-macos-installer.sh

      - name: Download matching managed PHP runtime
        uses: actions/download-artifact@v4
        with:
          name: dcp-php-runtime-${{ matrix.php_arch }}
          path: ${{ runner.temp }}/dcp-php-runtime

      - name: Download matching llama.cpp runtime
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.engine_artifact }}
          path: platform/dcp-env/engines/llama.cpp/${{ matrix.runtime_dir }}

      - name: Restore engine executable mode and verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="platform/dcp-env/engines/llama.cpp/${{ matrix.runtime_dir }}"
          test -s "$RUNTIME/llama-server"
          chmod 0755 "$RUNTIME/llama-server"
          test -x "$RUNTIME/llama-server"
          test -s "$RUNTIME/LICENSE"
          test -s "$RUNTIME/OpenSSL-LICENSE.txt"
          file "$RUNTIME/llama-server" | grep -F "${{ matrix.arch }}"
          lipo "$RUNTIME/llama-server" -verify_arch "${{ matrix.arch }}"

      - name: Embed and verify matching managed PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${{ matrix.php_arch }}"
          ARCHIVE="${{ runner.temp }}/dcp-php-runtime/DCP-PHP-$ARCH.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          test -s "$ARCHIVE"
          test -s "$CHECKSUM"
          (cd "$(dirname "$ARCHIVE")" && shasum -a 256 -c "$(basename "$CHECKSUM")")
          TARGET="platform/dcp-env/runtime/php/$ARCH"
          mkdir -p "$TARGET"
          tar -xzf "$ARCHIVE" -C "$TARGET"
          test -x "$TARGET/bin/php"
          test -s "$TARGET/php.ini"
          test -s "$TARGET/php.sha256"
          ACTUAL="$(shasum -a 256 "$TARGET/bin/php" | awk '{print $1}')"
          EXPECTED="$(tr -d '[:space:]' < "$TARGET/php.sha256")"
          test "$ACTUAL" = "$EXPECTED"
          PHPRC="$TARGET/php.ini" PHP_INI_SCAN_DIR="$TARGET/conf.d" "$TARGET/bin/php" platform/scripts/verify-runtime.php

      - name: Install app build tools
        run: |
          brew install php
          brew list cmake >/dev/null 2>&1 || brew install cmake
          php -v
          cmake --version

      - name: Build native macOS application
        shell: bash
        env:
          DCP_MACOS_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x platform/scripts/*.sh platform/wrappers/build-macos.sh
          ./platform/scripts/build-macos.sh
          APP_VERSION="$(python3 -c 'import json;print(json.load(open("platform/version.json", encoding="utf-8"))["version"])')"
          APP_BUILD="$(python3 -c 'import json;print(json.load(open("platform/version.json", encoding="utf-8"))["build"])')"
          APP_REVISION="$(python3 -c 'import json;print(json.load(open("platform/version.json", encoding="utf-8"))["packageRevision"])')"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" DCP.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD" DCP.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :DCPPackageRevision integer $APP_REVISION" DCP.app/Contents/Info.plist || /usr/libexec/PlistBuddy -c "Set :DCPPackageRevision $APP_REVISION" DCP.app/Contents/Info.plist
          codesign --force --deep --sign - DCP.app
          codesign --verify --deep --strict DCP.app
          test -s DCP.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' DCP.app/Contents/Info.plist)" = "12.0.0"
          file DCP.app/Contents/MacOS/DCP | grep -F "${{ matrix.arch }}"

      - name: Assemble and inspect architecture-specific package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dcp-macos-package"
          OUT="$GITHUB_WORKSPACE/${{ matrix.package }}"
          RUNTIME_DIR="${{ matrix.runtime_dir }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DCP-UserData/macOS/data" "$STAGE/DCP-UserData/macOS/storage"
          cat > "$STAGE/DCP-UserData/README.txt" <<'NOTICE'
          DCP user data is device-local. macOS databases, encryption keys, logs, models and workspaces are stored under DCP-UserData/macOS. Never upload this directory.
          NOTICE
          ditto DCP.app "$STAGE/DCP.app"
          rsync -a platform/ "$STAGE/platform/" \
            --exclude '/data/***' --exclude '/storage/***' --exclude '/dist/***' \
            --exclude '/wrappers/***' --exclude '/tests/***' --exclude '/.env' --exclude '/.env.*' \
            --exclude '/vendor/***' --exclude '/dcp-env/build/***' \
            --exclude '/dcp-env/engines/llama.cpp/source/***' \
            --exclude '/dcp-env/engines/llama.cpp/macos-*/*'
          ENGINE_SOURCE="platform/dcp-env/engines/llama.cpp/$RUNTIME_DIR"
          ENGINE_STAGE="$STAGE/platform/dcp-env/engines/llama.cpp/$RUNTIME_DIR"
          mkdir -p "$ENGINE_STAGE"
          cp -R "$ENGINE_SOURCE/." "$ENGINE_STAGE/"
          chmod 0755 "$ENGINE_STAGE/llama-server"
          file "$ENGINE_STAGE/llama-server" | grep -F "${{ matrix.arch }}"
          PHP_ROOT="$STAGE/platform/dcp-env/runtime/php/${{ matrix.php_arch }}"
          test -x "$PHP_ROOT/bin/php"
          EXPECTED="$(tr -d '[:space:]' < "$PHP_ROOT/php.sha256")"
          ACTUAL="$(shasum -a 256 "$PHP_ROOT/bin/php" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          PHPRC="$PHP_ROOT/php.ini" PHP_INI_SCAN_DIR="$PHP_ROOT/conf.d" "$PHP_ROOT/bin/php" "$STAGE/platform/scripts/verify-runtime.php"
          touch "$STAGE/DCP-UserData/macOS/data/.gitkeep" "$STAGE/DCP-UserData/macOS/storage/.gitkeep"
          STAGE_VERSION="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$STAGE/platform/version.json")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$STAGE/DCP.app/Contents/Info.plist")"
          PACKAGE_REVISION="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1], encoding="utf-8"))["packageRevision"])' "$STAGE/platform/version.json")"
          BUNDLE_REVISION="$(/usr/libexec/PlistBuddy -c 'Print :DCPPackageRevision' "$STAGE/DCP.app/Contents/Info.plist")"
          test "$PACKAGE_REVISION" -ge 1
          test "$PACKAGE_REVISION" = "$BUNDLE_REVISION"
          test "$STAGE_VERSION" = "$BUNDLE_VERSION"
          (cd "$STAGE" && zip -qry "$OUT" DCP.app platform DCP-UserData)
          test -s "$OUT"
          unzip -Z1 "$OUT" | grep -F "platform/dcp-env/engines/llama.cpp/$RUNTIME_DIR/llama-server"
          unzip -Z1 "$OUT" | grep -F "platform/dcp-env/runtime/php/${{ matrix.php_arch }}/bin/php"
          if unzip -Z1 "$OUT" | grep -E 'storage/keys/master\.key$|data/dcp\.sqlite$'; then
            echo "Private user data leaked into package." >&2
            exit 1
          fi
          shasum -a 256 "$OUT"

      - name: Upload native macOS package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dcp-macos-${{ matrix.arch }}-package-ci
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
